<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1"/>
      <stop offset="100%" style="stop-color:#8B5CF6"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)"/>
  <!-- Hexagon icon (from sidebar) scaled up -->
  <g transform="translate(256,220) scale(8)" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="12 2 22 8.5 22 15.5 12 22 2 15.5 2 8.5 12 2" transform="translate(-12,-12)"/>
    <line x1="0" y1="10" x2="0" y2="3.5" transform="translate(0,0)"/>
    <polyline points="10 -3.5 0 3.5 -10 -3.5"/>
    <polyline points="0 -10 0 -3.5"/>
  </g>
  <!-- Text -->
  <text x="256" y="420" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="72" fill="white">CEx Insights</text>
</svg>
